<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM from scratch — canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="crumbs"></div>
  <div class="hdr-right">
    <span class="hint">drag = pan · wheel = zoom · click = notes · double-click = open · Esc = up</span>
    <button id="btn-fit" title="Fit to screen (F)">fit</button>
    <button id="btn-up" title="Go up one level (Esc)">↑ up</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5a6478"/>
        </marker>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="tour" hidden>
      <div class="tour-head"><span class="tour-step"></span><span class="tour-title"></span><button class="tour-end" title="end tour (Esc)">✕</button></div>
      <div class="tour-body md"></div>
      <div class="tour-nav"><button class="tour-prev">← prev</button><span class="tour-keys">← → keys</span><button class="tour-next">next →</button></div>
    </div>
    <div id="legend">
      <span><i class="sw weights"></i> learned weights</span>
      <span><i class="sw tensor"></i> tensor / data</span>
      <span><i class="sw op"></i> fixed operation</span>
      <span><i class="sw concept"></i> concept / process</span>
      <span><i class="dot done"></i> discussed <i class="dot revisit"></i> revisit <i class="dot todo"></i> not yet</span>
    </div>
  </div>
  <aside id="panel">
    <nav class="tabs">
      <button data-tab="notes" class="on">Notes</button>
      <button data-tab="story">Story</button>
      <button data-tab="map">Map</button>
      <button data-tab="log">Log</button>
    </nav>
    <section id="tab-notes" class="tab on"></section>
    <section id="tab-story" class="tab"></section>
    <section id="tab-map" class="tab"></section>
    <section id="tab-log" class="tab"></section>
  </aside>
</main>
<script src="scenes.js"></script>
<script src="log.js"></script>
<script src="widgets.js"></script>
<script src="app.js"></script>
</body>
</html>
